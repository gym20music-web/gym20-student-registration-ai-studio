<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0f;color:#f7f8fb;font-family:Tahoma,sans-serif;text-align:center;padding:20px}
main{max-width:340px;padding:24px;border:1px solid #55452a;border-radius:14px;background:#111722}

</style>

<body>
<main>
<b>GYM20 · برنامه کلاس‌های من</b>

<noscript>برای مشاهده برنامه، جاوااسکریپت مرورگر را فعال کنید.</noscript>
</main>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var match=location.pathname.match(/^\\/s\\/([0-9a-f]{12})\\/?$/i);
  if(match)params.set("c",match[1]);
  var query=params.toString();
  location.replace("/student.html"+(query?"?"+query:""));
})();
</script>
