<html lang="fa" dir="rtl">
<head>

<title>برنامه کلاس‌های من | GYM20</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#141821;--panel2:#1b2230;--gold:#e3bd62;--muted:#9ca3af;--line:#303746}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b1a13 0,#090b10 52%);color:#f8fafc;font-family:Vazirmatn,sans-serif;min-height:100vh;padding:22px 12px}
main{max-width:850px;margin:auto}.brand{font:800 13px Montserrat,sans-serif;color:var(--gold);letter-spacing:2px;text-align:center;margin:10px 0 18px}
header,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px #0005}
h1{font-size:1.25rem;margin:0 0 6px;color:var(--gold)}.muted{color:var(--muted);font-size:.85rem;line-height:1.8}
select{width:100%;padding:12px;border-radius:10px;background:var(--panel2);color:white;border:1px solid var(--line);font:inherit;margin-top:8px}
table{width:100%;border-collapse:collapse;min-width:620px;font-size:.85rem}th,td{text-align:right;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--gold);font-weight:700}
.table-wrap{overflow:auto}.status{display:inline-block;border-radius:20px;padding:4px 9px;background:#ffffff12;font-size:.75rem;white-space:nowrap}.present{color:#6ee7b7;background:#064e3b66}.absent{color:#fda4af;background:#88133766}.pending{color:#fcd34d;background:#78350f66}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}.session-count{color:var(--gold);font-weight:700}.hide{display:none!important}
@media(max-width:600px){body{padding:12px 8px}header,.card{padding:13px;border-radius:12px}h1{font-size:1.1rem}table{font-size:.78rem}th,td{padding:10px 7px}}
</style></head>
<body><main><div class="brand">GYM20 · POWER · FOCUS · ENERGY</div>
<header><h1>برنامه کلاس‌های من</h1><div id="studentName" class="muted">در حال دریافت برنامه…</div></header>
<section id="termPanel" class="card hide"><label for="termSelect">انتخاب ترم</label><select id="termSelect"></select><p id="termMeta" class="muted"></p></section>
<section class="card"><div id="schedule" class="empty">در حال بارگذاری…</div></section>
<footer class="muted" style="text-align:center">آکادمی ورزشی GYM20</footer></main>

</body></html>
