<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>پیام GYM20</title>
<style>
@font-face{font-family:Vazirmatn;src:local("Vazirmatn")}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080a0f;color:#f1f3f6;font-family:Vazirmatn,Tahoma,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 18%,rgba(218,184,103,.10),transparent 48%),linear-gradient(145deg,#101720,#080a0f 72%)}
main{width:min(100%,460px);padding:24px 20px 20px;border:1px solid rgba(218,184,103,.32);border-radius:20px;background:linear-gradient(145deg,rgba(35,44,55,.98),rgba(13,18,25,.99) 72%);box-shadow:0 28px 85px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.07)}
.brand{text-align:center;color:#e6c477;font:800 10px Montserrat,Arial,sans-serif;letter-spacing:2px}
h1{margin:14px 0 16px;text-align:center;font-size:17px;color:#f4f1e8}
#message{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px 15px;border:1px solid rgba(218,184,103,.22);border-radius:13px;background:linear-gradient(135deg,rgba(218,184,103,.085),rgba(255,255,255,.025));font-size:15px;font-weight:700;line-height:2;text-align:center}
a{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:18px;border:1px solid rgba(232,196,107,.55);border-radius:11px;background:linear-gradient(110deg,rgba(218,184,103,.18),rgba(218,184,103,.06));color:#f4dfad;text-decoration:none;font-size:12px;font-weight:800}
</style>
</head>
<body>
<main>
<div class="brand">GYM20</div>
<h1 id="title">وقتِ ارتقاست ⚡</h1>
<div id="message">امروز یک قدم جلوتر از دیروزی؛ آماده‌ای؟</div>
<a id="back" href="https://gym20.ir/">ورود به GYM20  ←</a>
</main>
<script>
(function(){
 const params=new URL(location.href).searchParams;
 const title=(params.get("gym20_title")||"وقتِ ارتقاست ⚡").slice(0,160);
 const message=(params.get("gym20_notice")||"امروز یک قدم جلوتر از دیروزی؛ آماده‌ای؟").slice(0,1200);
 const back=params.get("return_to")||"https://gym20.ir/";
 const sameText=title.trim().replace(/[؟?!،؛.\s]/g,"").toLocaleLowerCase("fa")===message.trim().replace(/[؟?!،؛.\s]/g,"").toLocaleLowerCase("fa");
 document.getElementById("title").textContent=sameText?"وقتِ ارتقاست ⚡":title;
 document.getElementById("message").textContent=sameText?"امروز یک قدم جلوتر از دیروزی؛ آماده‌ای؟":message;
 try{const u=new URL(back);document.getElementById("back").href=u.origin==="https://gym20.ir"?u.href:"https://gym20.ir/";}catch(_){}
})();
</script>
</body>
</html>
