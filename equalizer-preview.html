<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171c23"><title>آرشیو اکولایزر GYM20</title><style>*{box-sizing:border-box}body{margin:0;padding:20px 14px;background:radial-gradient(circle at 50% 0,#303945,#171c23 65%);color:#e8edf2;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:500px;margin:auto}.head{text-align:center;color:#e5c77e;font-size:18px}.hint{text-align:center;color:#aab4bf;font-size:12px;line-height:1.8}.card{margin-top:18px;padding:18px;border:1px solid #66583b;border-radius:18px;background:linear-gradient(145deg,#252d37,#1d242c);box-shadow:0 14px 32px #0005}.stage{height:150px;display:grid;place-items:center}.avatar{width:100px;height:100px;position:relative;display:grid;place-items:center}.ring{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.ring i{position:absolute;left:calc(50% - .6px);top:50%;width:1.2px;height:3px;border-radius:2px;background:linear-gradient(#f5f7fa,#aeb8c3);transform-origin:50% 0%;opacity:.75;will-change:height,opacity}.photo{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid #d9b96e;z-index:2;background:#303944}.name{text-align:center;font-size:13px;font-weight:bold}.desc{text-align:center;color:#c4ccd4;font-size:12px;line-height:1.8;min-height:42px;margin:10px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{border:1px solid #48515c;border-radius:10px;padding:11px 7px;background:#222a33;color:#dce3e9;font:12px Tahoma}.buttons button.on{border-color:#d9b96e;background:#443b2b;color:#f2d995}.note{text-align:center;color:#8995a2;font-size:10px;margin-top:14px}</style><main class="wrap"><h1 class="head">آرشیو نسخه‌های اکولایزر دایره‌ای</h1><p class="hint">هر نسخه را لمس کن تا حرکتش را ببینی. این صفحه فقط پیش‌نمایش است و سایت اصلی را تغییر نمی‌دهد.</p><section class="card"><div class="stage"><div class="avatar"><div class="ring" id="ring"></div><img class="photo" src="./music.webp" onerror="this.src='./music.jpg'"></div></div><div class="name">GYM20MUSIC</div><div class="desc" id="desc"></div><div class="buttons" id="buttons"></div></section><p class="note">شماره یا حرف نسخه‌ای را که می‌پسندی برایم بفرست.</p></main><script>
const V=[
['A · شروع اولیه','حلقه اولیه با میله‌های متغیر و موج تصادفی نرم.',48,'random',1.5,35],
['B · مینیمال ۲۸','۲۸ میله نقره‌ای باریک، حرکت ارگانیک کوتاه.',28,'organic',1.3,35],
['C · نامتقارن ۵۶','۵۶ میله نزدیک؛ سمت راست موج‌دارتر از چپ.',56,'asym',1.2,35],
['D · متراکم ۷۲','۷۲ میله ریز و نزدیک، موج چندلایه سمت راست.',72,'dense',1.1,35],
['E · چپ متحرک نرم','راست پرتحرک؛ چپ کوتاه با قله‌های باریک متحرک.',72,'left1',1.1,35],
['F · چپ ظریف‌تر','موج چپ کوتاه‌تر و آرام‌تر با چند قله گذرا.',72,'left2',1.1,35],
['G · نسخه ۹ نوامبر','نسخه ۷۲ میله‌ای با موج راست قوی و قله‌های سمت چپ.',72,'nov9',1.1,35]
];
const ring=document.getElementById('ring'),desc=document.getElementById('desc'),buttons=document.getElementById('buttons');let bars=[],raf=0,start=0,sel=0;
function choose(k){sel=k;cancelAnimationFrame(raf);ring.replaceChildren();bars=[];const v=V[k];for(let i=0;i<v[2];i++){const e=document.createElement('i'),a=i*360/v[2]*Math.PI/180;e.style.width=v[4]+'px';e.style.transform='rotate('+(i*360/v[2])+'deg) translateY(-'+v[5]+'px) scaleY(-1)';ring.append(e);bars.push({e,a,i})}desc.textContent=v[1];[...buttons.children].forEach((b,i)=>b.classList.toggle('on',i===k));start=performance.now();draw(start)}
function draw(now){const v=V[sel],t=(now-start)/1000;for(const {e,a,i} of bars){const side=Math.sin(a),R=Math.max(0,side),L=Math.max(0,-side);let h=3,o=.75;
if(v[3]==='random'){let w=(Math.sin(t*1.7+i*.41)+Math.sin(t*.83+i*.13)+2)/4;h=2+w*6;o=.72+w*.2}
if(v[3]==='organic'){let w=(Math.sin(t*1.4+i*.7)+1)/2;h=2.2+w*2.7;o=.58+w*.22}
if(v[3]==='asym'){let w=(Math.sin(t*1.4+a*2)+Math.sin(t*2-a*3)+2)/4;h=2.1+L*.8+R*(1+w*4.2);o=.68+w*.2}
if(['dense','left1','left2','nov9'].includes(v[3])){
 const b=(Math.sin(t*1.35+a*1.8)+1)/2,r=(Math.sin(t*2.05-a*3.1)+1)/2,q=(Math.sin(t*3+a*5.2)+1)/2;
 const rightWave=b*.42+r*.36+q*.22;
 let leftWave=.12,leftPeak=0;
 if(v[3]==='left1'){leftWave=.28+((Math.sin(t*1.25+a*2.1)+1)/2)*.35;leftPeak=Math.pow(Math.max(0,Math.sin(t*.9+a*3.7)),9)*1.8}
 if(v[3]==='left2'){leftWave=.08+((Math.sin(t*1.05+a*1.7)+1)/2)*.08;leftPeak=0}
 if(v[3]==='nov9'){leftWave=.10;leftPeak=Math.pow(Math.max(0,Math.sin(t*.72+a*4.6)),18)*4.8}
 h=2.1+R*(1.4+rightWave*5.2)+L*(.65+leftWave*2+leftPeak);
 o=.58+(R*rightWave+L*(leftWave*.45+leftPeak*.08))*.3;
}
e.style.height=h.toFixed(1)+'px';e.style.opacity=o.toFixed(2)}raf=requestAnimationFrame(draw)}
V.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v[0];b.onclick=()=>choose(i);buttons.append(b)});choose(0);
</script></html>
