name: Validate GYM20 split assets

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/validate-split-assets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in assets/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify referenced assets exist and preserve script order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']\.\/(assets\/[^"']+)["']/g)].map(m => m[1]);
          const missing = refs.filter(path => !fs.existsSync(path));
          if (missing.length) {
            console.error('Missing assets:', missing.join(', '));
            process.exit(1);
          }
          const scripts = [...html.matchAll(/<script\b[^>]*src=["']\.\/(assets\/[^"']+\.js)["'][^>]*>/gi)].map(m => m[1]);
          const expected = [
            'assets/gym20-script-01.js',
            'assets/gym20-script-02.js',
            'assets/gym20-script-03.js',
            'assets/gym20-script-04.js',
            'assets/gym20-script-05.js',
            'assets/gym20-script-06.js',
            'assets/gym20-script-07.js'
          ];
          if (JSON.stringify(scripts) !== JSON.stringify(expected)) {
            console.error('Unexpected script order:', scripts);
            process.exit(1);
          }
          console.log(`Validated ${refs.length} asset references and ${scripts.length} ordered scripts.`);
          NODE

      - name: Check CSS brace balance
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('assets').filter(name => name.endsWith('.css'));
          for (const file of files) {
            const css = fs.readFileSync('assets/' + file, 'utf8');
            let depth = 0;
            for (const ch of css) {
              if (ch === '{') depth++;
              if (ch === '}') depth--;
              if (depth < 0) throw new Error(file + ': unexpected closing brace');
            }
            if (depth !== 0) throw new Error(file + ': unbalanced braces (' + depth + ')');
          }
          console.log('CSS brace balance passed for ' + files.length + ' files.');
          NODE
